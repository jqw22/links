<!DOCTYPE html>
<html lang="en"><head>
  <title>Links</title>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://stackedit.io/style.css">
  <style>
    /* Add/Remove UI */
    #add-link-form {
      background: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 6px;
      padding: 14px 16px;
      margin-bottom: 20px;
    }
    #add-link-form h5 {
      margin: 0 0 10px 0;
    }
    #add-link-form label {
      display: block;
      font-size: 0.85em;
      margin-bottom: 2px;
      color: #555;
    }
    #add-link-form input,
    #add-link-form select {
      width: 100%;
      padding: 6px 8px;
      margin-bottom: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 0.9em;
      box-sizing: border-box;
    }
    #add-link-form button {
      padding: 6px 16px;
      background: #4078c0;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9em;
    }
    #add-link-form button:hover {
      background: #3568aa;
    }

    /* Delete button on links */
    .link-row {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-right: 6px;
    }
    .link-row .del-btn {
      display: inline-block;
      width: 18px;
      height: 18px;
      line-height: 16px;
      text-align: center;
      font-size: 14px;
      font-weight: bold;
      color: #c00;
      background: none;
      border: 1px solid transparent;
      border-radius: 50%;
      cursor: pointer;
      padding: 0;
      opacity: 0.35;
      transition: opacity 0.15s, border-color 0.15s;
      vertical-align: middle;
      flex-shrink: 0;
    }
    .link-row:hover .del-btn {
      opacity: 1;
      border-color: #c00;
    }
    .link-row .del-btn:hover {
      background: #fee;
    }

    /* Toggle edit mode */
    #toggle-edit {
      padding: 4px 12px;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85em;
      margin-bottom: 16px;
    }
    #toggle-edit:hover {
      background: #e4e4e4;
    }

    /* Sync status indicator */
    #sync-status {
      display: inline-block;
      font-size: 0.8em;
      margin-left: 10px;
      vertical-align: middle;
    }
    #sync-status.synced { color: #2a8; }
    #sync-status.local { color: #999; }
    #sync-status.error { color: #c66; }

    /* Hide edit UI by default */
    .edit-ui { display: none; }
    body.editing .edit-ui { display: block; }
    body.editing .link-row .del-btn { display: inline-block; }
    .link-row .del-btn { display: none; }
    body.editing .edit-ui { display: block; }
    body.editing .link-row .del-btn { display: inline-block; }
    .link-row .del-btn { display: none; }

    /* Empty category message */
    .empty-category {
      color: #999;
      font-style: italic;
      font-size: 0.9em;
    }
  </style>
</head>
<body class="stackedit">

  <div class="stackedit__toc">
    <ul>

  </div>

const CATEGORY_ORDER = [
  "Links",

  "Webapps",
  "Nostr",
  "Shopping",
  "Travel",
  "Finance",

const STORAGE_KEY = "links_data";

// ===== Nostr sync =====
const NOSTR_KIND = 30078;
const NOSTR_D_TAG = "links-page";
const RELAYS = [
  "wss://relay.damus.io",
  "wss://nos.lol",
  "wss://relay.primal.net"
];

let nostrPubkey = null;    // set once we detect a NIP-07 extension

function hasNostr() {
  return !!(window.nostr && window.nostr.getPublicKey);
}

function nostrEventFromLinks(links) {
  return {
    kind: NOSTR_KIND,
    content: JSON.stringify(links),
    tags: [["d", NOSTR_D_TAG]],
    created_at: Math.floor(Date.now() / 1000),
    pubkey: nostrPubkey
  };
}

function publishToRelay(relayUrl, event) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(relayUrl);
    const timeout = setTimeout(() => { ws.close(); reject(new Error("timeout")); }, 8000);
    ws.onopen = () => {
      ws.send(JSON.stringify(["EVENT", event]));
      // Wait briefly for OK, but don't block on it
      setTimeout(() => { clearTimeout(timeout); ws.close(); resolve(); }, 1000);
    };
    ws.onerror = () => { clearTimeout(timeout); reject(new Error("ws error")); };
  });
}

async function nostrPublish(links) {
  if (!nostrPubkey) return;
  const unsigned = nostrEventFromLinks(links);
  try {
    const signed = await window.nostr.signEvent(unsigned);
    // Fire-and-forget to all relays
    for (const relay of RELAYS) {
      publishToRelay(relay, signed).catch(() => {});
    }
  } catch (e) {
    console.warn("Nostr publish failed:", e);
  }
}

async function nostrFetch() {
  if (!nostrPubkey) return null;

  const filter = {
    kinds: [NOSTR_KIND],
    authors: [nostrPubkey],
    "#d": [NOSTR_D_TAG],
    limit: 1
  };

  // Try relays sequentially, return first result
  for (const relayUrl of RELAYS) {
    try {
      const events = await fetchFromRelay(relayUrl, filter);
      if (events.length > 0) {
        try {
          return JSON.parse(events[0].content);
        } catch (e) { /* skip malformed */ }
      }
    } catch (e) { /* try next relay */ }
  }
  return null;
}

function fetchFromRelay(relayUrl, filter) {
  return new Promise((resolve, reject) => {
    const ws = new WebSocket(relayUrl);
    const events = [];
    const timeout = setTimeout(() => { ws.close(); resolve(events); }, 6000);
    ws.onopen = () => {
      ws.send(JSON.stringify(["REQ", "links-fetch", filter]));
    };
    ws.onmessage = (msg) => {
      const [type, subId, event] = JSON.parse(msg.data);
      if (type === "EVENT" && subId === "links-fetch") {
        events.push(event);
      }
      if (type === "EOSE" && subId === "links-fetch") {
        clearTimeout(timeout);
        ws.close();
        resolve(events);
      }
    };
    ws.onerror = () => { clearTimeout(timeout); resolve(events); };
  });
}

// ===== localStorage fallback =====
function loadLinksLocal() {
  const stored = localStorage.getItem(STORAGE_KEY);
  if (stored) {
    try { return JSON.parse(stored); } catch (e) { /* fall through */ }
  }
  return DEFAULT_LINKS.map(l => ({ ...l }));
}

function saveLinksLocal(links) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(links));
}

// ===== Unified load/save =====
async function loadLinks() {
  if (hasNostr()) {
    try {
      nostrPubkey = await window.nostr.getPublicKey();
      const remote = await nostrFetch();
      if (remote && Array.isArray(remote) && remote.length > 0) {
        saveLinksLocal(remote);  // cache locally
        return remote;
      }
    } catch (e) {
      console.warn("Nostr fetch failed, using local:", e);
    }
  }
  return loadLinksLocal();
}

async function saveLinks(links) {
  saveLinksLocal(links);
  nostrPublish(links);  // fire-and-forget
}

// ===== Add a link =====
async function addLink(title, url, category) {
  const links = await loadLinks();
  links.push({ title: title.trim(), url: url.trim(), category });
  await saveLinks(links);
  await render();
}

// ===== Delete a link =====
async function deleteLink(index) {
  const links = await loadLinks();
  links.splice(index, 1);
  await saveLinks(links);
  await render();
}

// ===== Render everything =====
async function render() {
  let links = await loadLinks();
  if (!links || typeof links.map !== "function") {
    links = DEFAULT_LINKS.map(l => ({ ...l }));
  }

  // Build TOC
  const tocList = document.getElementById("toc-list");
  tocList.innerHTML = CATEGORY_ORDER
    .map(cat => `<li><a href="#${encodeURIComponent(cat)}">${escHtml(cat)}</a></li>`)
    .join("");

  // Build links HTML using real array indices
  const container = document.getElementById("links-container");
  let html = "";

  for (const cat of CATEGORY_ORDER) {
    html += `<h5 id="${encodeURIComponent(cat)}">${escHtml(cat)}</h5>\n`;

    const catLinks = links
      .map((link, idx) => ({ link, idx }))
      .filter(({ link }) => link.category === cat);

    if (catLinks.length === 0) {
      html += `<p class="empty-category">No links yet.</p>\n`;
    } else {
      for (const { link, idx } of catLinks) {
        html += `<span class="link-row">`;
        html += `<a href="${escAttr(link.url)}" target="_blank">${escHtml(link.title)}</a>`;
        html += `<button class="del-btn" data-idx="${idx}" title="Remove">&times;</button>`;
        html += `</span><br>\n`;
      }
    }
  }
  container.innerHTML = html;

  // Populate category dropdown
  const select = document.getElementById("link-category");
  select.innerHTML = CATEGORY_ORDER
    .map(cat => `<option value="${escAttr(cat)}">${escHtml(cat)}</option>`)
    .join("");

  // Attach delete handlers
  container.querySelectorAll(".del-btn").forEach(btn => {
    btn.addEventListener("click", function () {
      if (confirm("Remove this link?")) {
        deleteLink(parseInt(this.dataset.idx));
      }
    });
  });
}

// ===== Helpers =====
function escHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}
function escAttr(s) {
  return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// ===== Init =====
document.addEventListener("DOMContentLoaded", async () => {
  // Set sync status
  const statusEl = document.getElementById("sync-status");
  if (hasNostr()) {
    try {
      nostrPubkey = await window.nostr.getPublicKey();
      statusEl.textContent = "\u25C6 Nostr synced";
      statusEl.className = "synced";
    } catch (e) {
      statusEl.textContent = "\u25C7 local only";
      statusEl.className = "local";
    }
  } else {
    statusEl.textContent = "\u25C7 local only";
    statusEl.className = "local";
  }

  await render();

  // Toggle edit mode
  const toggleBtn = document.getElementById("toggle-edit");
  toggleBtn.addEventListener("click", () => {
    document.body.classList.toggle("editing");
    toggleBtn.textContent = document.body.classList.contains("editing")
      ? "Done Editing"
      : "Edit Links";
  });

  // Add link form
  document.getElementById("btn-add").addEventListener("click", () => {
    const title = document.getElementById("link-title").value.trim();
    const url   = document.getElementById("link-url").value.trim();
    const cat   = document.getElementById("link-category").value;

    if (!title) { alert("Please enter a title."); return; }
    if (!url)   { alert("Please enter a URL."); return; }
    if (!/^https?:\/\/.+/i.test(url)) {
      alert("URL must start with http:// or https://");
      return;
    }

    addLink(title, url, cat);
    document.getElementById("link-title").value = "";
    document.getElementById("link-url").value = "https://";
  });

  // Submit on Enter in URL field
  document.getElementById("link-url").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("btn-add").click();
  });
  document.getElementById("link-title").addEventListener("keydown", (e) => {
    if (e.key === "Enter") document.getElementById("btn-add").click();
  });
});
</script>
