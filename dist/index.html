    .link-row { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; }

      border-radius: 50%; cursor: pointer; padding: 0; opacity: 0.35; flex-shrink: 0;
    }
    .link-row:hover .del-btn { opacity: 1; border-color: #c00; }
    .link-row .del-btn:hover { background: #fee; }
    #toggle-edit {
      padding: 4px 12px; background: #f0f0f0; border: 1px solid #ccc;
      border-radius: 4px; cursor: pointer; font-size: 0.85em; margin-bottom: 16px;
    }
    .edit-ui { display: none; }
    body.editing .edit-ui { display: block; }
    body.editing .link-row .del-btn { display: inline-block; }
    .link-row .del-btn { display: none; }
    .empty-category { color: #999; font-style: italic; font-size: 0.9em; }
    #io-buttons { margin-bottom: 12px; display: none; }
    body.editing #io-buttons { display: block; }
    #io-buttons button {
      padding: 4px 10px; background: #f0f0f0; border: 1px solid #ccc;
      border-radius: 4px; cursor: pointer; font-size: 0.8em; margin-right: 6px;
    }

</head>

var CATS = ["Frequent links","Media / Entertainment","Webapps","Nostr","Shopping","Travel","Finance","Banking & Insurance","Gov","Home / Utilities","Photography","Jung","Health"];
var STOR = "links_overlay";
var base = BASE_LINKS;

function gOv() { try { var r=localStorage.getItem(STOR); return r?JSON.parse(r):{added:[],removed:[]}; } catch(e) { return {added:[],removed:[]}; } }
function sOv(o) { localStorage.setItem(STOR,JSON.stringify(o)); }
function lk(l) { return l.title+"|||"+l.url; }
function gLinks() {
  var o=gOv(), rk=new Set(o.removed.map(lk)), e=base.filter(function(l){return!rk.has(lk(l));});
  for(var i=0;i<o.added.length;i++) e.push(o.added[i]); return e;
}
function addLink(t,u,c) { var o=gOv(); o.added.push({title:t.trim(),url:u.trim(),category:c}); sOv(o); render(); }
function delLink(i) { var ls=gLinks(), l=ls[i]; if(!l)return; var k=lk(l), o=gOv(), ai=-1;
  for(var j=0;j<o.added.length;j++){if(lk(o.added[j])===k){ai=j;break;}}
  if(ai>=0) o.added.splice(ai,1); else o.removed.push({title:l.title,url:l.url}); sOv(o); render(); }
function saveToFile() {
  var ls=gLinks(), lines=[], push=function(s){lines.push(s);};
  for(var i=0;i<ls.length;i++){
    var l=ls[i], t=JSON.stringify(l.title), u=JSON.stringify(l.url), c=JSON.stringify(l.category);
    if(i<ls.length-1) push('  {"title":'+t+',"url":'+u+',"category":'+c+'},');
    else push('  {"title":'+t+',"url":'+u+',"category":'+c+'}');
  }
  var newData=lines.join('\n'), html=document.documentElement.outerHTML;
  var re=/var BASE_LINKS = \[[\s\S]*?\n\];/;
  html=html.replace(re,'var BASE_LINKS = [\n'+newData+'\n];');
  var b=new Blob([html],{type:"text/html"}), a=document.createElement("a");
  a.href=URL.createObjectURL(b); a.download="index.html"; a.click(); URL.revokeObjectURL(a.href);
}
function importJSON(f) { var r=new FileReader(); r.onload=function(){
  try{var d=JSON.parse(r.result);if(!Array.isArray(d)){alert("Invalid format.");return;}
  if(!confirm("Replace all links with imported file?"))return;base=d;sOv({added:[],removed:[]});render();}
  catch(e){alert("Could not parse JSON.");}}; r.readAsText(f); }
function render() {
  var ls=gLinks();
  document.getElementById("toc-list").innerHTML = CATS.map(function(c){return'<li><a href="#'+encodeURIComponent(c)+'">'+escH(c)+'</a></li>';}).join("");
  var h="",c=document.getElementById("links-container");
  for(var ci=0;ci<CATS.length;ci++){var ct=CATS[ci], cl=[];
    h+='<h5 id="'+encodeURIComponent(ct)+'">'+escH(ct)+'</h5>\n';
    for(var i=0;i<ls.length;i++){if(ls[i].category===ct)cl.push({l:ls[i],idx:i});}
    if(cl.length===0)h+='<p class="empty-category">No links yet.</p>\n';
    else for(var j=0;j<cl.length;j++){var x=cl[j];
      h+='<span class="link-row"><a href="'+escA(x.l.url)+'" target="_blank">'+escH(x.l.title)+'</a><button class="del-btn" data-idx="'+x.idx+'" title="Remove">&times;</button></span><br>\n';}
  }
  c.innerHTML=h;
  document.getElementById("link-category").innerHTML = CATS.map(function(x){return'<option value="'+escA(x)+'">'+escH(x)+'</option>';}).join("");
  var bs=c.querySelectorAll(".del-btn"); for(var b=0;b<bs.length;b++){bs[b].onclick=function(){if(confirm("Remove this link?"))delLink(parseInt(this.dataset.idx));};}
}
function escH(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}
function escA(s){return s.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
document.addEventListener("DOMContentLoaded",function(){
  render();
  document.getElementById("toggle-edit").onclick=function(){document.body.classList.toggle("editing");this.textContent=document.body.classList.contains("editing")?"Done Editing":"Edit Links";};
  document.getElementById("btn-add").onclick=function(){
    var t=document.getElementById("link-title").value.trim(), u=document.getElementById("link-url").value.trim(), c=document.getElementById("link-category").value;
    if(!t){alert("Please enter a title.");return;} if(!u){alert("Please enter a URL.");return;} if(!/^https?:\/\/.+/i.test(u)){alert("URL must start with http:// or https://");return;}
    addLink(t,u,c); document.getElementById("link-title").value=""; document.getElementById("link-url").value="https://";
  };
  document.getElementById("link-url").onkeydown=function(e){if(e.key==="Enter")document.getElementById("btn-add").click();};
  document.getElementById("link-title").onkeydown=function(e){if(e.key==="Enter")document.getElementById("btn-add").click();};
  document.getElementById("btn-export").onclick=saveToFile;
  var fi=document.getElementById("import-file");
  document.getElementById("btn-import").onclick=function(){fi.click();};
  fi.onchange=function(){if(fi.files[0])importJSON(fi.files[0]);fi.value="";};
});
