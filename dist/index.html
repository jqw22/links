    .link-row .del-btn {
      display: inline-block; width: 18px; height: 18px; line-height: 16px;
      text-align: center; font-size: 14px; font-weight: bold; color: #c00;
      background: none; border: 1px solid transparent; border-radius: 50%;
      cursor: pointer; padding: 0; opacity: 0.35;
      transition: opacity 0.15s, border-color 0.15s; vertical-align: middle; flex-shrink: 0;
    }
    .link-row:hover .del-btn { opacity: 1; border-color: #c00; }
    .link-row .del-btn:hover { background: #fee; }
    #toggle-edit {
      padding: 4px 12px; background: #f0f0f0; border: 1px solid #ccc;
      border-radius: 4px; cursor: pointer; font-size: 0.85em; margin-bottom: 16px;
    }
    #toggle-edit:hover { background: #e4e4e4; }
    .edit-ui { display: none; }
    body.editing .edit-ui { display: block; }
    body.editing .link-row .del-btn { display: inline-block; }
    .link-row .del-btn { display: none; }
    .empty-category { color: #999; font-style: italic; font-size: 0.9em; }
    #io-buttons { margin-bottom: 12px; display: none; }
    body.editing #io-buttons { display: block; }
    #io-buttons button {

      border-radius: 4px; cursor: pointer; font-size: 0.8em; margin-right: 6px;
    }
    #io-buttons button:hover { background: #e4e4e4; }
  </style>

const STORAGE_KEY = "links_overlay";
let baseLinks = LINKS_DATA;

// ===== Overlay logic =====
function getOverlay() {
  try { var raw = localStorage.getItem(STORAGE_KEY); return raw ? JSON.parse(raw) : { added: [], removed: [] }; }
  catch (e) { return { added: [], removed: [] }; }
}
function saveOverlay(ov) { localStorage.setItem(STORAGE_KEY, JSON.stringify(ov)); }
function linkKey(l) { return l.title + "|||" + l.url; }

function getEffectiveLinks() {
  if (!baseLinks) return [];
  var ov = getOverlay();
  var removedKeys = new Set(ov.removed.map(linkKey));
  var effective = baseLinks.filter(function(l) { return !removedKeys.has(linkKey(l)); });
  for (var i = 0; i < ov.added.length; i++) effective.push(ov.added[i]);
  return effective;
}

function addLink(title, url, category) {
  var ov = getOverlay();
  ov.added.push({ title: title.trim(), url: url.trim(), category: category });
  saveOverlay(ov);
  render();
}

function deleteLink(index) {
  var links = getEffectiveLinks();
  var link = links[index];
  if (!link) return;
  var key = linkKey(link);
  var ov = getOverlay();
  var addedIdx = -1;
  for (var i = 0; i < ov.added.length; i++) { if (linkKey(ov.added[i]) === key) { addedIdx = i; break; } }
  if (addedIdx >= 0) { ov.added.splice(addedIdx, 1); }
  else { ov.removed.push({ title: link.title, url: link.url }); }
  saveOverlay(ov);
  render();
}

// ===== Export / Import =====
function exportJSON() {
  var links = getEffectiveLinks();
  var blob = new Blob([JSON.stringify(links, null, 2)], { type: "application/json" });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "links.json";
  a.click();
  URL.revokeObjectURL(a.href);
}

function importJSON(file) {
  var reader = new FileReader();
  reader.onload = function() {
    try {
      var imported = JSON.parse(reader.result);
      if (!Array.isArray(imported)) { alert("Invalid format: expected an array."); return; }
      if (!confirm("This will replace your current links with the imported file. Continue?")) return;
      baseLinks = imported;
      saveOverlay({ added: [], removed: [] });
      render();
    } catch (e) { alert("Could not parse the file as JSON."); }
  };
  reader.readAsText(file);
}

// ===== Render =====
function render() {
  var links = getEffectiveLinks();
  var tocList = document.getElementById("toc-list");
  tocList.innerHTML = CATEGORY_ORDER.map(function(c) { return '<li><a href="#' + encodeURIComponent(c) + '">' + escHtml(c) + '</a></li>'; }).join("");

  var container = document.getElementById("links-container");
  var html = "";
  for (var ci = 0; ci < CATEGORY_ORDER.length; ci++) {
      var cat = CATEGORY_ORDER[ci];
      html += '<h5 id="' + encodeURIComponent(cat) + '">' + escHtml(cat) + '</h5>\n';
      var catLinks = [];
      for (var i = 0; i < links.length; i++) { if (links[i].category === cat) catLinks.push({ link: links[i], idx: i }); }
      if (catLinks.length === 0) { html += '<p class="empty-category">No links yet.</p>\n'; }
      else {
        for (var j = 0; j < catLinks.length; j++) {
          var l = catLinks[j];
          html += '<span class="link-row"><a href="' + escAttr(l.link.url) + '" target="_blank">' + escHtml(l.link.title) + '</a><button class="del-btn" data-idx="' + l.idx + '" title="Remove">&times;</button></span><br>\n';
        }
      }
    }
  }
  container.innerHTML = html;

  var select = document.getElementById("link-category");
  select.innerHTML = CATEGORY_ORDER.map(function(c) { return '<option value="' + escAttr(c) + '">' + escHtml(c) + '</option>'; }).join("");

  var btns = container.querySelectorAll(".del-btn");
  for (var b = 0; b < btns.length; b++) {
    btns[b].addEventListener("click", function() { if (confirm("Remove this link?")) deleteLink(parseInt(this.dataset.idx)); });
  }
}

// ===== Helpers =====
function escHtml(s) { var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
function escAttr(s) { return s.replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }

// ===== Init =====
document.addEventListener("DOMContentLoaded", function() {
  render();

  document.getElementById("toggle-edit").addEventListener("click", function() {
    document.body.classList.toggle("editing");
    this.textContent = document.body.classList.contains("editing") ? "Done Editing" : "Edit Links";
  });

  document.getElementById("btn-add").addEventListener("click", function() {
    var title = document.getElementById("link-title").value.trim();
    var url = document.getElementById("link-url").value.trim();
    var cat = document.getElementById("link-category").value;
    if (!title) { alert("Please enter a title."); return; }
    if (!url) { alert("Please enter a URL."); return; }
    if (!/^https?:\/\/.+/i.test(url)) { alert("URL must start with http:// or https://"); return; }
    addLink(title, url, cat);
    document.getElementById("link-title").value = "";
    document.getElementById("link-url").value = "https://";
  });

  document.getElementById("link-url").addEventListener("keydown", function(e) { if (e.key === "Enter") document.getElementById("btn-add").click(); });
  document.getElementById("link-title").addEventListener("keydown", function(e) { if (e.key === "Enter") document.getElementById("btn-add").click(); });
  document.getElementById("btn-export").addEventListener("click", exportJSON);
  var fi = document.getElementById("import-file");
  document.getElementById("btn-import").addEventListener("click", function() { fi.click(); });
  fi.addEventListener("change", function() { if (fi.files[0]) importJSON(fi.files[0]); fi.value = ""; });
});
</script>
